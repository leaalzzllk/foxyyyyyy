services:
  - type: web
    name: foxy-iptv
    rootDir: iptv_scan-main
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
